<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0f1f">
<title>A Birthday Surprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   A BIRTHDAY SURPRISE  -  single file, no build steps
   Edit the CONFIG block near the bottom (search: CONFIG)
   ========================================================= */
:root{
  --script:'Great Vibes','Brush Script MT',cursive;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --hand:'Caveat','Comic Sans MS',cursive;
  --gold:linear-gradient(135deg,#f9e8a6,#d9a93f 45%,#fff0b8 60%,#b98524);
  --w:min(208px,46vw);
  --h:calc(var(--w)*1.42);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0710;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#1a0f1f;user-select:none;-webkit-user-select:none}

/* ---------- scenes ---------- */
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
.scene.active{opacity:1;visibility:visible}
.art{position:absolute;inset:0;overflow:hidden;transform:scale(1.07);transition:transform 1.6s cubic-bezier(.2,.8,.2,1)}
.scene.active .art{transform:scale(1)}
.sv{width:100%;height:100%;display:block}
.scene.active .sv{animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:scale(1.03) translate(0,0) rotate(0)}50%{transform:scale(1.03) translate(-4px,3px) rotate(-.3deg)}}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(0,0,0,.55) 100%)}
.hud{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:60px 22px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.cap{margin:0;font:italic 500 17px var(--serif);color:#fff;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.6);min-height:24px}
.act{pointer-events:none;opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s;width:100%;max-width:320px;min-height:52px;padding:0 26px;border-radius:32px;border:1px solid rgba(255,255,255,.55);background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.1));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;font:600 16px var(--sans);letter-spacing:.2px;box-shadow:0 8px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.act.show{pointer-events:auto;opacity:1;transform:none}
.act.show:active{transform:scale(.97)}

/* music pill */
#musicPill{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;z-index:60;min-height:40px;padding:0 14px;border-radius:24px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;font:500 12.5px var(--sans);box-shadow:0 4px 16px rgba(0,0,0,.3);transition:opacity .4s}
#musicPill.off{opacity:.75}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
svg.defs{position:absolute;width:0;height:0;overflow:hidden}

/* scene 1 */
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
.pulse.p2{animation-delay:.6s}
@keyframes pulse{0%{transform:scale(.6);opacity:.95}100%{transform:scale(2.3);opacity:0}}
#s1.knocked .pulse,#s1.knocked .tapdot{display:none}
#knockTarget{cursor:pointer}
.doorg.shake{animation:shake .55s}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-4px)}30%{transform:translateX(3px)}45%{transform:translateX(-3px)}60%{transform:translateX(2px)}}
/* scene 2 door swing */
.swing-wrap{position:absolute;inset:0;perspective:900px;z-index:2;pointer-events:none}
.door-swing{position:absolute;inset:0;transform-origin:15% 50%}
.door-swing svg{width:100%;height:100%;display:block}
#s2.active .door-swing{animation:swing 1.6s .2s cubic-bezier(.55,0,.3,1) forwards}
@keyframes swing{0%{transform:rotateY(0);opacity:1}80%{opacity:1}100%{transform:rotateY(-104deg);opacity:0}}
.pop{transform-box:fill-box;transform-origin:center bottom}
#s2.active .guyg{animation:guyIn 1s 1.1s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes guyIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
/* scene 3 gift hop */
#s3.active .giftmove{animation:hop 1.5s .5s ease-in-out both}
@keyframes hop{0%{transform:translate(0,0)}50%{transform:translate(62px,-46px)}100%{transform:translate(118px,26px)}}
#s3.active .handsmove{animation:hide .3s 1.9s forwards}
@keyframes hide{to{opacity:0}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
/* cake */
.rise{transform:translateY(150px)}
#s4.active .rise{animation:rise 1.1s .9s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes rise{from{transform:translateY(150px)}to{transform:translateY(0)}}
.boxtop{transform-box:fill-box;transform-origin:center}
#s4.active .boxtop{animation:fly 1s .45s ease-in forwards}
@keyframes fly{to{transform:translateY(-430px) rotate(-14deg);opacity:0}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}100%{transform:scale(.92,1.08) rotate(2deg)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;transition:transform .35s ease-in,opacity .35s}
.cake.out .fl{transform:scale(.1);opacity:0}
.smoke{opacity:0}
.cake.out .smoke{animation:smoke 2.4s calc(var(--i)*.1s) ease-out forwards}
@keyframes smoke{0%{opacity:.75;transform:translateY(0)}100%{opacity:0;transform:translateY(-55px)}}
.candleglow{transition:opacity .6s}
.cake.out~.x{}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
/* scene 6 */
.knife{transform:translateY(-440px)}
#s6.active .knife{animation:knifeCut 3.1s .3s ease-in-out forwards}
@keyframes knifeCut{0%{transform:translateY(-440px)}28%{transform:translateY(0)}52%{transform:translateY(0)}82%,100%{transform:translateY(-440px)}}
#s6.active .slab{animation:slab 1s 1.35s cubic-bezier(.3,.8,.3,1) both}
@keyframes slab{from{transform:translate(0,0)}to{transform:translate(50px,32px)}}
.plate2,.cutface{opacity:0}
#s6.active .plate2{animation:fadeIn .6s 1.2s forwards}
#s6.active .cutface{animation:fadeIn .4s 1.4s forwards}
@keyframes fadeIn{to{opacity:1}}
/* scene 7 */
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.bk{animation:floaty 9s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
.fh{position:absolute;bottom:-40px;font-size:22px;z-index:3;pointer-events:none;animation:fup 4.5s ease-in forwards}
@keyframes fup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-110vh) scale(1.3) rotate(18deg);opacity:0}}

/* ---------- scene 8: 3D card ---------- */
#s8 .bg8{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#5b0f22 0%,#2a0713 55%,#12030a 100%)}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 2px rgba(255,226,140,.8);animation:tw 3s ease-in-out infinite}
.stage{position:absolute;left:50%;top:44%;width:var(--w);height:var(--h);transform:translate(-50%,-50%) translateY(115vh);transition:transform 1.5s cubic-bezier(.2,.9,.25,1.08),opacity 1s;z-index:3}
.stage.rise{transform:translate(-50%,-50%)}
.stage.zoom{transform:translate(-50%,-50%) scale(1.55);opacity:0;pointer-events:none}
.cardwrap{width:100%;height:100%;perspective:1500px;animation:cbob 3.6s ease-in-out infinite}
.stage.opened .cardwrap{animation:none}
@keyframes cbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.4,.1,.2,1)}
.card.open{transform:translateX(calc(var(--w)/2))}
.card::after{content:"";position:absolute;left:4%;right:4%;bottom:-26px;height:22px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%);transform:translateZ(-2px)}
.inside{position:absolute;inset:0;transform:translateZ(-1px);border-radius:3px 8px 8px 3px;background:linear-gradient(90deg,#e4cfa7,#fbf1e0 14%,#fbf1e0 90%,#efdcb8);box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;overflow:hidden}
.inside .frame,.cb .frame{position:absolute;inset:8px;border:1.5px solid #c99a35;border-radius:4px;pointer-events:none}
.inside .frame::after,.cb .frame::after{content:"";position:absolute;inset:4px;border:.6px solid #d9b45a;border-radius:2px}
.in-to{text-align:center;color:#7a1626;position:relative}
.in-to small{display:block;font:italic 12px var(--serif);letter-spacing:.5px;color:#9a6a3a}
.in-to b{display:block;font:400 32px/1.15 var(--script);margin:2px 0 6px}
.in-to i{font-style:normal;font-size:20px;animation:tw 1.6s infinite}
.cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.4,.1,.2,1)}
.card.open .cover{transform:rotateY(-180deg)}
.cf,.cb{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:3px 8px 8px 3px;overflow:hidden}
.cf{background:radial-gradient(ellipse at 30% 20%,#b3182c,#7d0c1d 60%,#560813),#7d0c1d;box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08)}
.cf::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(0,0,0,.05) 0 2px,transparent 2px 5px);mix-blend-mode:overlay}
.cf::after{content:"";position:absolute;top:0;bottom:0;left:0;width:10px;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent)}
.cf svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cb{transform:rotateY(180deg);background:linear-gradient(270deg,#e4cfa7,#fbf1e0 14%,#fbf1e0 90%,#efdcb8);display:flex;align-items:center;justify-content:center;text-align:center;color:#7a1626;font:italic 13px/1.5 var(--serif)}
.cb span{position:relative;padding:0 18px}
.seal{transform-box:fill-box;transform-origin:center}
.seal.crack{animation:crack .7s forwards}
@keyframes crack{30%{transform:scale(1.18) rotate(7deg)}100%{transform:scale(.5) rotate(-14deg);opacity:0}}
.gtxt{font-family:var(--script)}
.hands{position:absolute;left:-6px;width:calc(100% + 12px);top:calc(var(--h) - 56px);overflow:visible;z-index:5;transition:opacity .5s;pointer-events:none}
.stage.opened .hands{opacity:0}
.tapcard{position:absolute;inset:0;z-index:6;background:none;border:0}

/* ---------- memory book ---------- */
.book{position:absolute;inset:0;z-index:30;opacity:0;visibility:hidden;transform:scale(.9);transition:opacity .9s,transform .9s,visibility .9s;display:flex;flex-direction:column;padding:max(54px,calc(env(safe-area-inset-top) + 46px)) 12px calc(12px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 0,#5b0f22,#240612 70%)}
.book.in{opacity:1;visibility:visible;transform:none}
.bframe{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;border-radius:20px;border:2px solid transparent;background:linear-gradient(#fcf3e4,#f3e2c6) padding-box,var(--gold) border-box;box-shadow:0 18px 50px rgba(0,0,0,.55);overflow:hidden}
.bframe::before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,154,53,.55);border-radius:15px;pointer-events:none}
.view{flex:1;min-height:0;overflow:hidden;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .6s cubic-bezier(.22,.8,.24,1)}
.slide{flex:0 0 100%;min-width:0;padding:26px 22px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#5a1a26;overflow-y:auto;overflow-x:hidden;font-family:var(--sans)}
.sl-h{font:italic 600 13px var(--serif);letter-spacing:2.5px;text-transform:uppercase;color:#b0852a;margin-bottom:16px}
.sl-h::before,.sl-h::after{content:" ✦ ";color:#d9a93f}
.msg p{margin:0 0 12px;font:400 25px/1.25 var(--script);color:#6b1626;opacity:0;transform:translateY(10px)}
.slide.on .msg p{animation:rise2 .9s calc(var(--i)*.6s + .3s) both}
@keyframes rise2{to{opacity:1;transform:none}}
.sign{margin-top:8px;font:400 30px var(--script);color:#a3202f;opacity:0}
.slide.on .sign{animation:rise2 1s 3s both}
.stack{position:relative;width:100%;height:290px}
.pol{position:absolute;left:50%;top:46%;width:176px;height:216px;margin:-108px 0 0 -88px;padding:0;border:0;background:none;perspective:900px;transition:transform .6s cubic-bezier(.3,.9,.3,1)}
.pin{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,.9,.3,1)}
.pol.flip .pin{transform:rotateY(180deg)}
.pf,.pb{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:#fffdf8;border-radius:3px;box-shadow:0 8px 20px rgba(60,20,20,.35),0 1px 0 #fff inset;padding:10px 10px 0;text-align:center}
.pf .ph,.pf img{width:156px;height:156px;object-fit:cover;display:block;background:linear-gradient(135deg,#ffd9e0,#f7b6c8);border-radius:2px}
.ph{display:flex!important;align-items:center;justify-content:center;flex-direction:column;color:#c0486b;font:500 12px var(--sans);gap:4px}
.ph b{font-size:34px}
.pf em{display:block;margin-top:9px;font:500 21px var(--hand);color:#4a3a3a;font-style:normal}
.pb{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;padding:18px;font:500 21px/1.2 var(--hand);color:#6b1626}
.ctl{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:8px}
.gbtn{min-height:46px;padding:0 22px;border-radius:26px;border:1px solid #c99a35;background:linear-gradient(135deg,#8c1124,#5f0a18);color:#ffe9a8;font:600 14px var(--sans);box-shadow:0 6px 16px rgba(120,20,40,.35)}
.gbtn:active{transform:scale(.97)}
.gbtn.hid{display:none}
.tiny{font:12px var(--sans);color:#a07a5a;margin-top:10px}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:330px}
.rc{height:128px;padding:0;border:0;background:none;perspective:700px}
.rin{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.9,.3,1)}
.rc{position:relative}
.rc.open .rin{transform:rotateY(180deg)}
.rf,.rb{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:10px}
.rf{background:linear-gradient(135deg,#a3182e,#6c0b1c);color:#ffd9de;font-size:38px;box-shadow:0 6px 16px rgba(110,15,35,.35),inset 0 0 0 1.5px rgba(233,200,114,.6)}
.rf small{font:500 11px var(--sans);letter-spacing:1px;opacity:.8;margin-top:2px}
.rb{transform:rotateY(180deg);background:#fffaf0;border:1.5px solid #d9b45a;color:#6b1626;font:500 14.5px/1.35 var(--serif);font-style:italic}
.orbs{display:flex;gap:16px;justify-content:center;margin:2px 0 16px}
.orb{width:84px;height:84px;border-radius:50%;border:1.5px solid #d9b45a;background:radial-gradient(circle at 35% 30%,#fff7d6,#f1cf74 60%,#c58f2a);color:#7a1626;font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(233,190,80,.7);animation:orbp 2.2s infinite}
.orb small{font:600 10.5px var(--sans);letter-spacing:.5px}
.orb.done{animation:none;background:radial-gradient(circle at 35% 30%,#ffe8ee,#e6859b 65%,#b9455f);color:#fff;box-shadow:0 0 22px 6px rgba(230,120,150,.55)}
@keyframes orbp{70%{box-shadow:0 0 0 16px rgba(233,190,80,0)}100%{box-shadow:0 0 0 0 rgba(233,190,80,0)}}
.wlist{width:100%;max-width:320px;min-height:96px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.wchip{padding:10px 14px;border-radius:14px;background:#fffaf0;border:1px solid #e3c47a;font:italic 500 15px/1.3 var(--serif);color:#6b1626;animation:chipIn .6s both}
@keyframes chipIn{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
.fin-sc{font:400 46px/1 var(--script);color:#a3202f}
.fin-sc.big{font-size:64px;margin-bottom:6px;background:var(--gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 rgba(120,60,0,.35))}
.fin-name{font:600 14px var(--sans);letter-spacing:4px;text-transform:uppercase;color:#7a1626;margin:4px 0 14px}
.fin p{margin:0 0 18px;font:italic 500 16px/1.45 var(--serif);color:#6b1626;max-width:290px}
.bnav{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 14px;position:relative;z-index:2}
.nb{width:48px;height:48px;border-radius:50%;border:1px solid #c99a35;background:rgba(255,255,255,.55);color:#7a1626;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.nb:disabled{opacity:.25;pointer-events:none}
.dots{display:flex;gap:7px}
.dt{width:8px;height:8px;border-radius:8px;background:#d9c19a;border:0;padding:0;transition:all .35s}
.dt.on{width:24px;background:linear-gradient(90deg,#a3182e,#d9a93f)}
.bt{position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:31;font:400 26px var(--script);color:#ffe9a8;opacity:0;transition:opacity 1s .5s}
.bt.in{opacity:1}
</style>
</head>
<body>

<!-- shared gradients & symbols (kept at 0x0 so url(#id) works everywhere) -->
<svg class="defs" aria-hidden="true">
  <defs>
    <linearGradient id="gWood" x1="0" x2="1"><stop offset="0" stop-color="#8a5532"/><stop offset="1" stop-color="#5a3320"/></linearGradient>
    <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe9a2"/><stop offset=".5" stop-color="#c9983a"/><stop offset="1" stop-color="#8a5f1c"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbeaa8"/><stop offset=".45" stop-color="#d9a93f"/><stop offset=".6" stop-color="#fff0b8"/><stop offset="1" stop-color="#b98524"/></linearGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
    <radialGradient id="gGlowPink"><stop offset="0" stop-color="#fff0e0" stop-opacity=".85"/><stop offset="1" stop-color="#ff9ab0" stop-opacity="0"/></radialGradient>
    <linearGradient id="gWall1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3350"/><stop offset="1" stop-color="#241a2b"/></linearGradient>
    <linearGradient id="gHall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe9c8"/><stop offset="1" stop-color="#e5c595"/></linearGradient>
    <linearGradient id="gRoom" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46305a"/><stop offset="1" stop-color="#2a1b36"/></linearGradient>
    <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a4630"/><stop offset="1" stop-color="#3d2619"/></linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1b3d"/><stop offset="1" stop-color="#3b3a7a"/></linearGradient>
    <linearGradient id="gWallDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1530"/><stop offset="1" stop-color="#4a2238"/></linearGradient>
    <linearGradient id="gTable" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4a2c"/><stop offset="1" stop-color="#3f2416"/></linearGradient>

    music = ctx.createGain(); music.gain.value = 0.9; music.connect(master);
    sfx = ctx.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function unlock() {
    init();
    if (!ctx) return;
    if (ctx.state !== 'running') ctx.resume();
    if (!started) { started = true; syncMusic(); }
  }
  function syncMusic() {
    if (!ctx) return;
    if (!musicOn) { stopSynth(); ext.pause(); return; }
    if (extOK()) { stopSynth(); ext.play().catch(() => { startSynth(); }); }
    else startSynth();
  }
  ext.addEventListener('canplay', () => { if (started && musicOn) syncMusic(); });

  function pluck(f, t, dur, vel, dest, type) {
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = type || 'triangle'; o2.type = 'sine';
    o.frequency.value = f; o2.frequency.value = f * 2;
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(700, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(dest);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }
  function playStep(t, s) {
    const bar = Math.floor(s / 8) % 4, i = s % 8;
    const midi = CH[bar][PAT[i]];
    const vel = (i === 0 ? 0.30 : i % 2 ? 0.13 : 0.19) * rnd(0.85, 1.1);
    pluck(mtof(midi), t + rnd(0, 0.012), i === 0 ? 2.6 : 1.7, vel, music);
    const m = MEL[bar][i];
    if (m) pluck(mtof(m), t, 2.2, 0.09, music, 'sine');
  }
  function sched() {
    while (nextT < ctx.currentTime + 0.7) { playStep(nextT, step); nextT += EIGHTH; step++; }
  }
  function startSynth() {
    if (timer || !ctx) return;
    music.gain.cancelScheduledValues(ctx.currentTime);
    music.gain.setTargetAtTime(0.9, ctx.currentTime, 0.1);
    nextT = ctx.currentTime + 0.1; step = 0;
    timer = setInterval(sched, 120);
  }
  function stopSynth() {
    if (timer) { clearInterval(timer); timer = 0; }
    if (ctx) music.gain.setTargetAtTime(0, ctx.currentTime, 0.08);
  }
  function toggle() {
    musicOn = !musicOn;
    const pill = $('#musicPill');
    pill.textContent = musicOn ? '🎵 Jo Tum Mere Ho' : '🔇';
    pill.classList.toggle('off', !musicOn);
    unlock();
    syncMusic();
  }

  /* ---- sfx building blocks ---- */
  function env(g, t, a, d, peak) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(type, f0, f1, t, dur, peak, dest) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, Math.min(0.01, dur / 4), dur, peak);
    o.connect(g); g.connect(dest || sfx);
    o.start(t); o.stop(t + dur + 0.06);
  }
  function noise(t, dur, type, f0, f1, peak, attack) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = type;
    f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); env(g, t, attack || 0.02, dur, peak);
    s.connect(f); f.connect(g); g.connect(sfx);
    s.start(t, Math.random()); s.stop(t + dur + (attack || 0.02) + 0.1);
  }
  function run(fn, delay) {
    init(); if (!ctx) return;
    if (ctx.state !== 'running') ctx.resume();
    fn(ctx.currentTime + 0.03 + (delay || 0));
  }
  const PENTA = [74, 76, 78, 81, 83, 86, 88];
  const fx = {
    knock: () => run(t => [0, 0.22].forEach(d => { tone('triangle', 150, 55, t + d, 0.18, 0.9); noise(t + d, 0.06, 'lowpass', 900, 300, 0.45, 0.003); })),
    swing: () => run(t => { tone('sine', 160, 540, t, 0.6, 0.2); noise(t, 0.8, 'bandpass', 300, 1500, 0.2, 0.15); tone('sawtooth', 90, 130, t, 0.5, 0.03); }),
    invite: () => run(t => [74, 78, 81, 86].forEach((m, i) => { tone('sine', mtof(m), mtof(m), t + i * 0.1, 1.5, 0.2); tone('triangle', mtof(m - 12), mtof(m - 12), t + i * 0.1, 1.2, 0.08); })),
    unbox: () => run(t => { [0, 0.13, 0.27].forEach(d => noise(t + d, 0.18, 'bandpass', 2500, 4200, 0.22, 0.01)); noise(t + 0.4, 0.45, 'highpass', 3000, 5000, 0.12, 0.05); [81, 86, 90].forEach((m, i) => tone('sine', mtof(m), mtof(m), t + 0.7 + i * 0.12, 1.3, 0.16)); }),
    blow: () => run(t => { noise(t, 0.7, 'lowpass', 600, 1400, 0.55, 0.18); tone('sine', 520, 180, t + 0.75, 0.35, 0.12); noise(t + 0.75, 0.3, 'highpass', 4000, 6000, 0.1, 0.02); }),
    slice: () => run(t => { tone('triangle', 1100, 260, t, 0.28, 0.14); noise(t, 0.24, 'highpass', 3000, 6000, 0.2, 0.02); tone('sine', 120, 55, t + 0.4, 0.16, 0.5); }),
    embrace: () => run(t => [50, 54, 57, 62, 66].forEach((m, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      o.type = i % 2 ? 'sine' : 'triangle'; o.frequency.value = mtof(m);
      lp.type = 'lowpass'; lp.frequency.value = 1400;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.14, t + 1.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 5.2);
      o.connect(lp); lp.connect(g); g.connect(sfx); o.start(t); o.stop(t + 5.4);
    })),
    cardOpen: () => run(t => { noise(t, 0.9, 'highpass', 5000, 9000, 0.1, 0.25); for (let i = 0; i < 10; i++) { const m = PENTA[(Math.random() * PENTA.length) | 0] + 12; tone('sine', mtof(m), mtof(m), t + i * 0.085, 0.7, 0.1); } [74, 78, 81, 86].forEach((m, i) => tone('triangle', mtof(m - 12), mtof(m - 12), t + 0.2 + i * 0.05, 1.8, 0.1)); }),
    chime: () => run(t => { const m = PENTA[(Math.random() * 5) | 0] + 12; tone('sine', mtof(m), mtof(m), t, 1.2, 0.2); tone('sine', mtof(m + 12), mtof(m + 12), t + 0.05, 0.8, 0.07); }),
    pop: () => run(t => tone('sine', 500, 900, t, 0.1, 0.16)),
    tick: () => run(t => tone('sine', 700, 500, t, 0.06, 0.07))
  };
  return Object.assign({ unlock, toggle }, fx);
})();

/* ================= CONFETTI (no libraries) ================= */
const FX = (() => {
  const cv = $('#fx'), c = cv.getContext('2d');
  let W = 0, H = 0, P = [], raf = 0;
  const COL = ['#ff6b8b', '#ffd36a', '#8fd3ff', '#b79cff', '#ffffff', '#ff9a56', '#7ee2a8'];
  function size() {
    const r = app.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function burst(fx, fy, n, o) {
    o = o || {};
    if (!W) size();
    const x = W * fx, y = H * fy;
    for (let i = 0; i < n; i++) {
      const a = (o.angle !== undefined ? o.angle : -Math.PI / 2) + (Math.random() - 0.5) * (o.spread !== undefined ? o.spread : Math.PI * 2);
      const sp = (o.speed || 10) * (0.4 + Math.random() * 0.9);
      P.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: rnd(6, 12), h: rnd(3, 7), r: rnd(0, 6.28), vr: rnd(-0.35, 0.35), col: COL[(Math.random() * COL.length) | 0], circ: Math.random() < 0.25, life: 0, max: rnd(130, 220) });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    c.clearRect(0, 0, W, H);
    P = P.filter(p => p.life < p.max && p.y < H + 30);
    for (const p of P) {
      p.vy += 0.22; p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      c.globalAlpha = Math.min(1, (p.max - p.life) / (p.max * 0.3));
      c.fillStyle = p.col; c.save(); c.translate(p.x, p.y); c.rotate(p.r);
      if (p.circ) { c.beginPath(); c.arc(0, 0, p.h * 0.8, 0, 6.28); c.fill(); } else c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      c.restore();
    }
    c.globalAlpha = 1;
    raf = P.length ? requestAnimationFrame(tick) : 0;
    if (!raf) c.clearRect(0, 0, W, H);
  }
  addEventListener('resize', size);
  return { burst, size };
})();

  if (si === N - 1 && !celebrated) { celebrated = true; celebrate(); }
}
function celebrate() {
  Snd.chime();
  [0, 400, 900, 1500].forEach((d, k) => setTimeout(() => { FX.burst(.1, .95, 70, { angle: -1.15, spread: .9, speed: 15 }); FX.burst(.9, .95, 70, { angle: -1.99, spread: .9, speed: 15 }); if (k > 1) FX.burst(.5, .4, 80, { speed: 10 }); Snd.pop(); }, d));
  let rain = 0; const iv = setInterval(() => { FX.burst(rnd(.1, .9), -.02, 8, { angle: Math.PI / 2, spread: .6, speed: 3 }); if (++rain > 14) clearInterval(iv); }, 350);
}
$('#prev').addEventListener('click', () => { Snd.tick(); showSlide(si - 1); });
$('#next').addEventListener('click', () => { Snd.tick(); showSlide(si + 1); });
dotsBox.addEventListener('click', e => { const b = e.target.closest('.dt'); if (b) { Snd.tick(); showSlide(+b.dataset.i); } });

/* swipe */
(() => {
  const v = $('#view'); let x0 = 0, y0 = 0, t0 = 0, swiped = false;
  v.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; t0 = Date.now(); swiped = false; });
  v.addEventListener('pointerup', e => {
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3 && Date.now() - t0 < 900) { swiped = true; Snd.tick(); showSlide(si + (dx < 0 ? 1 : -1)); }
  });
  v.addEventListener('click', e => { if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; } }, true);
})();

/* polaroid stack */
const POS = [
  'translate(0,0) rotate(-2deg) scale(1)',
  'translate(16px,10px) rotate(5deg) scale(.96)',
  'translate(-14px,20px) rotate(-6deg) scale(.92)'
];
let order = CONFIG.photos.map((_, i) => i);
function layoutStack() {
  const pols = $$('.pol');
  order.forEach((k, pos) => { const p = pols[k]; const q = Math.min(pos, POS.length - 1); p.style.transform = POS[q]; p.style.zIndex = 10 - pos; p.style.pointerEvents = pos === 0 ? 'auto' : 'none'; });
}
layoutStack();
$('#stack').addEventListener('click', e => { const p = e.target.closest('.pol'); if (p) { p.classList.toggle('flip'); Snd.pop(); } });
$('#shuf').addEventListener('click', () => {
  $$('.pol').forEach(p => p.classList.remove('flip'));
  order.push(order.shift()); layoutStack(); Snd.chime();
});

/* reasons */
let found = 0;
$$('.rc').forEach(b => b.addEventListener('click', () => {
  if (b.classList.contains('open')) return;
  b.classList.add('open'); found++; Snd.chime();
  $('#rcount').textContent = found >= CONFIG.reasons.length ? 'Every single one is true 💗' : `${found} / ${CONFIG.reasons.length} found`;
  if (found >= CONFIG.reasons.length) { FX.burst(.5, .6, 60, { speed: 9 }); }
}));

/* wishes */
let wished = 0;
$$('.orb').forEach(b => b.addEventListener('click', () => {
  if (b.classList.contains('done')) return;
  b.classList.add('done'); wished++; Snd.chime(); Snd.pop();
  const r = b.getBoundingClientRect(), a = app.getBoundingClientRect();
  FX.burst((r.left + r.width / 2 - a.left) / a.width, (r.top + r.height / 2 - a.top) / a.height, 36, { speed: 8 });
  const chip = document.createElement('div'); chip.className = 'wchip'; chip.textContent = CONFIG.wishes[+b.dataset.i];
  $('#wlist').appendChild(chip);
  if (wished >= CONFIG.wishes.length) $('#skyBtn').classList.remove('hid');
}));
$('#skyBtn').addEventListener('click', () => { Snd.cardOpen(); showSlide(N - 1); });
$('#replay').addEventListener('click', () => location.reload());

/* ================= BOOT ================= */
(function boot() {
  buildScenes();
  // build the door that swings open in scene 2 from scene 1's door leaf
  const sw = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  sw.setAttribute('viewBox', '0 0 440 860'); sw.setAttribute('preserveAspectRatio', 'xMidYMid slice');
  sw.appendChild($('#s1 .doorg').cloneNode(true));
  $('#s2 .door-swing').appendChild(sw);
  FX.size();
  enter[1]();
})();
</script>
</body>
